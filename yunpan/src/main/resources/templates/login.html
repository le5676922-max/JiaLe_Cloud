<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JiaLe Cloud - 登录</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"',
                            '"PingFang SC"', '"Microsoft YaHei"', '"Helvetica Neue"', 'Arial',
                            'sans-serif'
                        ],
                    },
                }
            }
        }
    </script>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ========== 全局 & 背景 ========== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #1e293b;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
                "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 30%, #312e81 60%, #1e1b4b 100%);
            overflow: hidden;
        }

        /* ========== 动态光效背景 ========== */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            pointer-events: none;
            animation: float 16s ease-in-out infinite;
        }

        .bg-orb--1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
            top: -15%;
            left: -10%;
            animation-delay: 0s;
        }

        .bg-orb--2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            bottom: -12%;
            right: -8%;
            animation-delay: -5s;
        }

        .bg-orb--3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
            top: 40%;
            left: 55%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -40px) scale(1.08);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }
            75% {
                transform: translate(-35px, -15px) scale(1.05);
            }
        }

        /* ========== 毛玻璃卡片 ========== */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 420px;
            max-width: 92vw;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            padding: 44px 40px 36px;
            animation: card-in 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ========== 输入框组 ========== */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group i.icon-left {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            pointer-events: none;
            transition: color 0.25s;
        }

        .input-group input {
            width: 100%;
            height: 50px;
            padding: 0 46px 0 44px;
            font-size: 15px;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-group input:focus {
            border-color: rgba(99, 102, 241, 0.7);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: rgba(255, 255, 255, 0.1);
        }

        .input-group input:focus~.icon-left {
            color: #a5b4fc;
        }

        /* 密码可见性切换 */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            font-size: 15px;
            padding: 6px;
            transition: color 0.2s;
            line-height: 1;
        }

        .toggle-password:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* ========== 登录按钮 ========== */
        .btn-login {
            width: 100%;
            height: 50px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.25s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            box-shadow: 0 6px 28px rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: scale(0.975);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading 旋转动画 */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-login.is-loading .spinner {
            display: inline-block;
        }

        .btn-login.is-loading .btn-text {
            /* 保持文字可见但 spinner 在前 */;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ========== 错误提示块 ========== */
        .error-toast {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 18px;
            color: #fca5a5;
            font-size: 14px;
            animation: shake 0.4s ease-in-out;
        }

        .error-toast.show {
            display: flex;
        }

        .error-toast i {
            font-size: 16px;
            flex-shrink: 0;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        /* ========== 页脚 ========== */
        .footer-text {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
        }

        .footer-text a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: rgba(255, 255, 255, 0.65);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .glass-card {
                padding: 32px 24px 28px;
                border-radius: 20px;
            }

            .input-group input {
                height: 46px;
                font-size: 14px;
            }

            .btn-login {
                height: 46px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 动态光效背景层 ========== -->
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>

    <!-- ========== 毛玻璃登录卡片 ========== -->
    <div class="glass-card">

        <!-- 顶部 Logo & 标题 -->
        <div class="text-center mb-8">
            <!-- 云存储图标 -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4"
                 style="background: rgba(99,102,241,0.18);">
                <i class="fa-solid fa-cloud-arrow-up text-3xl" style="color: #a5b4fc;"></i>
            </div>
            <h1 class="text-2xl font-semibold tracking-tight text-white mb-1">JiaLe&nbsp;Cloud</h1>
            <p class="text-sm" style="color: rgba(255,255,255,0.45);">安全、私密、属于你</p>
        </div>

        <!-- ========== 错误提示块（默认隐藏） ========== -->
        <div id="errorBlock" class="error-toast">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorText">账号或密码错误</span>
        </div>

        <!-- ========== 登录表单 ========== -->
        <form id="loginForm" novalidate>

            <!-- 账号 -->
            <div class="input-group">
                <i class="fa-solid fa-user icon-left"></i>
                <input type="email" id="email" name="email"
                       placeholder="请输入邮箱" autocomplete="email" required autofocus>
            </div>

            <!-- 密码 + 可见性切换 -->
            <div class="input-group">
                <i class="fa-solid fa-lock icon-left"></i>
                <input type="password" id="password" name="password"
                       placeholder="请输入密码" autocomplete="current-password" required>
                <button type="button" class="toggle-password" id="togglePwd" tabindex="-1"
                        aria-label="切换密码可见性">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn-login" id="loginBtn">
                <span class="spinner" id="spinner"></span>
                <span class="btn-text" id="btnText">登&nbsp;&nbsp;录</span>
            </button>
        </form>

        <!-- 页脚提示 -->
        <p class="footer-text">
            首次使用？请联系管理员获取账号&nbsp;&nbsp;|&nbsp;&nbsp;
            <a href="#">忘记密码</a>
        </p>
    </div>

    <!-- ========== Vanilla JS 业务逻辑 ========== -->
    <script>
        (function() {
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const togglePwd = document.getElementById('togglePwd');
            const pwdInput = document.getElementById('password');
            const errorBlock = document.getElementById('errorBlock');
            const errorText = document.getElementById('errorText');
            const emailInput = document.getElementById('email');

            // ---- 密码可见性切换 ----
            togglePwd.addEventListener('click', function() {
                const isPassword = pwdInput.type === 'password';
                pwdInput.type = isPassword ? 'text' : 'password';
                const icon = togglePwd.querySelector('i');
                icon.className = isPassword ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
            });

            // ---- 设置/取消 Loading 态 ----
            function setLoading(loading) {
                if (loading) {
                    loginBtn.classList.add('is-loading');
                    loginBtn.disabled = true;
                    btnText.textContent = '登录中...';
                } else {
                    loginBtn.classList.remove('is-loading');
                    loginBtn.disabled = false;
                    btnText.textContent = '登  录';
                }
            }

            // ---- 显示错误信息 ----
            function showError(message) {
                errorText.textContent = message;
                errorBlock.classList.add('show');
                // 重新触发抖动动画
                errorBlock.style.animation = 'none';
                errorBlock.offsetHeight; // 强制回流
                errorBlock.style.animation = '';
            }

            // ---- 隐藏错误信息 ----
            function hideError() {
                errorBlock.classList.remove('show');
            }

            // ---- 表单提交 ----
            async function sha256(message) {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideError();

                const email = emailInput.value.trim();
                const password = pwdInput.value;

                // 前端基本校验
                if (!email) {
                    showError('请输入邮箱');
                    emailInput.focus();
                    return;
                }
                if (!password) {
                    showError('请输入密码');
                    pwdInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const passwordHash = await sha256(password);
                    const response = await fetch('http://localhost:8080/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password: passwordHash }),
                    });

                    const result = await response.json();

                    if (!response.ok || result.code !== 200) {
                        throw new Error(result.message || '账号或密码错误');
                    }

                    // 提取 token 并存入 localStorage
                    const token = result.data?.token;
                    if (!token) {
                        throw new Error('服务端未返回有效 Token');
                    }

                    localStorage.setItem('cloud_token', token);

                    // 跳转到网盘主页
                    window.location.href = '/index.html';

                } catch (err) {
                    // 区分网络异常与业务异常
                    if (err.name === 'TypeError' && err.message.includes('fetch')) {
                        showError('网络连接失败，请检查网络或后端服务');
                    } else {
                        showError(err.message || '登录失败，请稍后重试');
                    }
                    setLoading(false);
                }
            });

            // ---- 页面加载完成，自动聚焦 ----
            emailInput.focus();
        })();
    </script>

</body>
</html>
